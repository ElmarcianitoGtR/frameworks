services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda_ropa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda_ropa
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tienda_ropa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
